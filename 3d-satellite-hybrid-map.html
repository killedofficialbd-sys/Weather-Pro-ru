<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Weather Pro — 3D Спутниковая карта</title>
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
      background: #12151e;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    #map {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    #weather-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 2;
    }

    /* Кнопка переключения слоев (как в Яндекс / Google Картах) */
    .layers-wrapper {
      position: absolute;
      top: 16px;
      right: 16px;
      z-index: 10;
    }
    .layer-toggle-btn {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      background: rgba(24, 26, 32, 0.92);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
      transition: transform 0.15s ease, background 0.2s ease;
    }
    .layer-toggle-btn:active {
      transform: scale(0.95);
    }

    /* Выпадающее меню слоев (Карта / Спутник / Гибрид) */
    .layers-menu {
      position: absolute;
      top: 56px;
      right: 0;
      width: 210px;
      background: rgba(26, 28, 34, 0.96);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 18px;
      padding: 8px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.6);
      display: none;
      flex-direction: column;
      gap: 4px;
    }
    .layers-menu.open {
      display: flex;
      animation: fadeIn 0.18s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .layer-option {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 14px;
      border-radius: 12px;
      border: none;
      background: transparent;
      color: #e2e8f0;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      text-align: left;
      transition: background 0.15s ease, color 0.15s ease;
    }
    .layer-option:hover {
      background: rgba(255, 255, 255, 0.08);
    }
    .layer-option.active {
      background: rgba(59, 130, 246, 0.22);
      color: #60a5fa;
      font-weight: 600;
    }
    .layer-option svg {
      width: 22px;
      height: 22px;
      flex-shrink: 0;
    }

    /* Нижняя панель управления */
    .bottom-controls {
      position: absolute;
      bottom: 20px;
      left: 16px;
      right: 16px;
      z-index: 10;
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .ctrl-btn {
      background: rgba(24, 26, 32, 0.92);
      backdrop-filter: blur(12px);
      color: #f8fafc;
      border: 1px solid rgba(255, 255, 255, 0.14);
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
      transition: all 0.2s ease;
    }
    .ctrl-btn.active {
      background: #3b82f6;
      border-color: #60a5fa;
      color: #ffffff;
    }
    .maplibregl-ctrl-top-left {
      top: 16px !important;
      left: 16px !important;
    }
  </style>
</head>
<body>

<div id="map"></div>
<div class="map-city-chip" aria-live="polite"><i class="fa-solid fa-location-dot" aria-hidden="true"></i><span id="map-city-name">Махачкала · стартовый вид</span></div>
<canvas id="weather-canvas"></canvas>

<!-- Кнопка и меню выбора слоев как на скриншоте -->
<div class="layers-wrapper">
  <button class="layer-toggle-btn" id="btn-layer-menu" title="Слои карты">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="24" height="24">
      <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
      <polyline points="2 17 12 22 22 17"></polyline>
      <polyline points="2 12 12 17 22 12"></polyline>
    </svg>
  </button>

  <div class="layers-menu" id="layers-menu">
    <button class="layer-option active" data-mode="map">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"></polygon>
        <line x1="8" y1="2" x2="8" y2="18"></line>
        <line x1="16" y1="6" x2="16" y2="22"></line>
      </svg>
      <span>Карта</span>
    </button>

    <button class="layer-option" data-mode="satellite">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M8 3l4 8 5-5 5 15H2L8 3z"></path>
      </svg>
      <span>Спутник</span>
    </button>

    <button class="layer-option" data-mode="hybrid">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
        <polyline points="2 17 12 22 22 17"></polyline>
        <polyline points="2 12 12 17 22 12"></polyline>
      </svg>
      <span>Гибрид</span>
    </button>
  </div>
</div>

<!-- Нижние быстрые кнопки -->
<div class="bottom-controls">
  <button class="ctrl-btn active" id="btn-3d">3D Наклон</button>
  <button class="ctrl-btn" id="btn-locate">Следить за мной</button>
  <button class="ctrl-btn" id="btn-rain" aria-label="Включить визуальную анимацию дождя">Эффект дождя</button>
  <button class="ctrl-btn" id="btn-theme">День / Ночь</button>
</div>

<script>
  let currentMode = 'map'; // 'map' | 'satellite' | 'hybrid'
  let isDark = false;
  let is3D = true;

  // Координаты Махачкалы (пр. Имама Шамиля, как на ваших скриншотах)
  const START_CENTER = [47.4858, 42.9685];

  const map = new maplibregl.Map({
    container: 'map',
    style: 'https://tiles.openfreemap.org/styles/liberty',
    center: START_CENTER,
    zoom: 16.5,
    pitch: 60,
    bearing: -15,
    antialias: true
  });

  map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }), 'top-left');

  const geolocate = new maplibregl.GeolocateControl({
    positionOptions: { enableHighAccuracy: true },
    trackUserLocation: true,
    showUserHeading: true
  });
  map.addControl(geolocate, 'top-left');

  // Логика открытия/закрытия меню слоев
  const menuBtn = document.getElementById('btn-layer-menu');
  const layersMenu = document.getElementById('layers-menu');

  menuBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    layersMenu.classList.toggle('open');
  });
  layersMenu.addEventListener('click',e=>e.stopPropagation());

  document.addEventListener('click', () => {
    layersMenu.classList.remove('open');
  });

  // Инициализация спутникового источника (Esri World Imagery - бесплатные спутниковые снимки высокого разрешения)
  function setupSatelliteAnd3D() {
    if (!map.getSource('satellite-source')) {
      map.addSource('satellite-source', {
        type: 'raster',
        tiles: [
          'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'
        ],
        tileSize: 256,
        attribution: 'Esri World Imagery'
      });
    }

    const styleLayers = map.getStyle().layers;
    let firstRoadOrLabelId = null;
    for (const layer of styleLayers) {
      if (layer.id.includes('road') || layer.id.includes('highway') || layer.type === 'symbol') {
        firstRoadOrLabelId = layer.id;
        break;
      }
    }

    // Добавляем слой спутника над фоном земли, но под дорогами и подписями
    if (!map.getLayer('satellite-layer')) {
      map.addLayer({
        id: 'satellite-layer',
        type: 'raster',
        source: 'satellite-source',
        layout: {
          visibility: currentMode === 'map' ? 'none' : 'visible'
        },
        paint: {
          'raster-opacity': 1,
          'raster-contrast': 0.08,
          'raster-saturation': 0.12
        }
      }, firstRoadOrLabelId);
    }

    // Настраиваем реалистичные 3D-здания
    let labelLayerId = null;
    for (const layer of styleLayers) {
      if (layer.type === 'symbol' && layer.layout && layer.layout['text-field']) {
        labelLayerId = layer.id;
        break;
      }
    }

    if (map.getLayer('building-3d')) {
      map.removeLayer('building-3d');
    }

    if (!map.getLayer('realistic-3d-buildings')) {
      map.addLayer({
        id: 'realistic-3d-buildings',
        source: 'openmaptiles',
        'source-layer': 'building',
        type: 'fill-extrusion',
        minzoom: 14,
        paint: {
          'fill-extrusion-color': [
            'case',
            ['has', 'colour'], ['get', 'colour'],
            [
              'interpolate', ['linear'], ['coalesce', ['get', 'render_height'], 10],
              0, '#e5dec9',
              15, '#d8cfc0',
              35, '#cbd5e1',
              70, '#94a3b8'
            ]
          ],
          'fill-extrusion-height': ['coalesce', ['get', 'render_height'], 8],
          'fill-extrusion-base': ['coalesce', ['get', 'render_min_height'], 0],
          'fill-extrusion-opacity': 0.88,
          'fill-extrusion-vertical-gradient': true
        }
      }, labelLayerId);
    }

    // Направленное солнечное освещение для объема 3D-граней
    map.setLight({
      anchor: 'viewport',
      color: '#ffffff',
      intensity: 0.45,
      position: [1.5, 180, 45]
    });

    applyMapMode(currentMode);
  }

  // Переключение между Карта / Спутник / Гибрид
  function applyMapMode(mode) {
    currentMode = mode;
    const layers = map.getStyle().layers;

    if (map.getLayer('satellite-layer')) {
      map.setLayoutProperty('satellite-layer', 'visibility', mode === 'map' ? 'none' : 'visible');
    }

    for (const layer of layers) {
      const id = layer.id;
      if (id === 'satellite-layer' || id === 'realistic-3d-buildings') continue;

      if (mode === 'map') {
        // Обычная векторная 3D-карта
        map.setLayoutProperty(id, 'visibility', 'visible');
        if (layer.type === 'line' && id.includes('road')) {
          map.setPaintProperty(id, 'line-opacity', 1);
        }
      } else if (mode === 'satellite') {
        // Чистый спутник (без дорог и подписей улиц, как на 1-м скрине)
        map.setLayoutProperty(id, 'visibility', 'none');
      } else if (mode === 'hybrid') {
        // Гибрид: спутниковые снимки + полупрозрачные дороги + названия улиц и номера домов (как на 2-м скрине)
        const isRoad = id.includes('road') || id.includes('highway') || id.includes('bridge') || id.includes('tunnel');
        const isLabel = layer.type === 'symbol';

        if (isRoad) {
          map.setLayoutProperty(id, 'visibility', 'visible');
          if (layer.type === 'line') {
            map.setPaintProperty(id, 'line-opacity', 0.55);
          }
        } else if (isLabel) {
          map.setLayoutProperty(id, 'visibility', 'visible');
        } else {
          map.setLayoutProperty(id, 'visibility', 'none');
        }
      }
    }

    // В режиме спутника и гибрида делаем 3D-дома полупрозрачными, чтобы сквозь них читались реальные крыши со снимка
    if (map.getLayer('realistic-3d-buildings')) {
      map.setLayoutProperty('realistic-3d-buildings', 'visibility', mode === 'satellite' ? 'none' : 'visible');
      map.setPaintProperty('realistic-3d-buildings', 'fill-extrusion-opacity', mode === 'hybrid' ? 0.35 : 0.88);
    }

    // Обновляем активный пункт в меню
    document.querySelectorAll('.layer-option').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.mode === mode);
    });
  }

  document.querySelectorAll('.layer-option').forEach(btn => {
    btn.addEventListener('click', () => {
      applyMapMode(btn.dataset.mode);
      layersMenu.classList.remove('open');
    });
  });

  let pendingParentCity = null;
  function setParentWeatherCity(data) {
    const lat=Number(data?.lat), lon=Number(data?.lon);
    if(!Number.isFinite(lat)||lat < -90||lat > 90||!Number.isFinite(lon)||lon < -180||lon > 180)return;
    const city={lat,lon,name:String(data.name||'Активный город').slice(0,90)};
    const label=document.getElementById('map-city-name');
    if(label)label.textContent=city.name;
    if(map.loaded() && map.isStyleLoaded()) {
      map.flyTo({center:[city.lon,city.lat],zoom:16.2,pitch:is3D?60:0,bearing:-15,duration:1050});
    } else pendingParentCity=city;
  }
  window.addEventListener('message',event=>{
    if(event.source!==window.parent)return;
    const data=event.data||{};
    if(data.type==='weatherpro:set-city')setParentWeatherCity(data);
    if(data.type==='weatherpro:resize-map')setTimeout(()=>map.resize(),80);
  });
  map.on('style.load',()=>{
    setupSatelliteAnd3D();
    if(pendingParentCity){const city=pendingParentCity;pendingParentCity=null;setParentWeatherCity(city);}
  });
  map.once('load',()=>{
    try{window.parent.postMessage({type:'weatherpro:map-ready'},'*');}catch(e){}
    map.resize();
  });
  window.addEventListener('resize',()=>map.resize());

  // Кнопка 3D наклона
  const btn3d = document.getElementById('btn-3d');
  btn3d.addEventListener('click', () => {
    is3D = !is3D;
    map.easeTo({ pitch: is3D ? 60 : 0, duration: 600 });
    btn3d.classList.toggle('active', is3D);
  });

  // Кнопка слежения за пользователем
  const btnLocate = document.getElementById('btn-locate');
  btnLocate.addEventListener('click', () => {
    geolocate.trigger();
    btnLocate.classList.add('active');
  });

  // Переключение День / Ночь
  const btnTheme = document.getElementById('btn-theme');
  btnTheme.addEventListener('click', () => {
    isDark = !isDark;
    btnTheme.classList.toggle('active', isDark);
    map.setStyle(isDark ? 'https://tiles.openfreemap.org/styles/dark' : 'https://tiles.openfreemap.org/styles/liberty');
  });

  // Частицы осадков (дождь)
  const canvas = document.getElementById('weather-canvas');
  const ctx = canvas.getContext('2d');
  let rainActive = false;
  let drops = [];

  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  for (let i = 0; i < 160; i++) {
    drops.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      len: Math.random() * 18 + 10,
      speed: Math.random() * 7 + 8
    });
  }

  let rainFrame=0;
  function animateRain() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    if (!rainActive) { rainFrame=0; return; }
    ctx.strokeStyle = 'rgba(147, 197, 253, 0.55)';
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    for (const d of drops) {
      ctx.moveTo(d.x, d.y);
      ctx.lineTo(d.x - 2, d.y + d.len);
      d.y += d.speed;
      d.x -= 0.8;
      if (d.y > canvas.height) { d.y = -20; d.x = Math.random() * canvas.width; }
    }
    ctx.stroke();
    rainFrame=requestAnimationFrame(animateRain);
  }

  const btnRain = document.getElementById('btn-rain');
  btnRain.addEventListener('click', () => {
    rainActive = !rainActive;
    btnRain.classList.toggle('active', rainActive);
    if(rainActive&&!rainFrame)animateRain();
    if(!rainActive&&rainFrame){cancelAnimationFrame(rainFrame);rainFrame=0;ctx.clearRect(0,0,canvas.width,canvas.height);}
  });
</script>

</body>
</html>
